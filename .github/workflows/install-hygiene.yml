name: Install Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build universal Agent wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel --outdir dist-agent
      - name: Install without Rust
        run: |
          python -m pip install --force-reinstall dist-agent/*.whl
          kitt --help >/dev/null
          python -c "from kitt.native.bridge import NativeCodeEngine; e=NativeCodeEngine('.'); assert e.status.backend == 'python', e.status; print(e.status)"

  toolbox-native-composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false
      - name: Checkout native toolbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-toolbox
          ref: e81e8cb944b8fc1dedb78a6c60a1c6c8e9a3370e
          path: toolbox
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build and install Agent plus toolbox native wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip build maturin
          python -m build --wheel --outdir agent-dist agent
          python -m pip install --force-reinstall agent-dist/*.whl
          python toolbox/packaging/build_native_release.py --out native-dist
          python -m pip install --force-reinstall native-dist/*.whl
          kitt --help >/dev/null
          python - <<'PY'
          from kitt.native.bridge import NativeCodeEngine
          import kitt_native
          engine = NativeCodeEngine('.')
          assert engine.status.backend == 'rust', engine.status
          print(kitt_native.ENGINE_VERSION, engine.status)
          PY
