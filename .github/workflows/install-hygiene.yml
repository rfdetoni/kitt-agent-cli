name: Install Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  source-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build universal fallback wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel --outdir dist-fallback
      - name: Install without Rust
        run: |
          python -m pip install --force-reinstall dist-fallback/*.whl
          kitt --help >/dev/null
          python -c "from kitt.native.bridge import NativeCodeEngine; e=NativeCodeEngine('.'); print(e.status.backend)"

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native wheel
        run: |
          python -m pip install -U pip maturin
          python packaging/build_native_release.py --out dist-native
      - name: Install and require Rust backend
        shell: bash
        run: |
          python -m pip install --force-reinstall dist-native/*.whl
          kitt --help >/dev/null
          python - <<'PY'
          from kitt.native.bridge import NativeCodeEngine
          engine = NativeCodeEngine('.')
          assert engine.status.backend == 'rust', engine.status
          print(engine.status)
          PY
