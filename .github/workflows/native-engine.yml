name: native-engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'kitt/native/**'
      - 'Cargo.toml'
      - '.github/workflows/native-engine.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'kitt/native/**'

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-fallback:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python packaging/verify_cleanroom.py
      - run: python -m pytest tests/native -q

  native-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.8,<2'
      - run: maturin build --release --manifest-path crates/kitt-native-python/Cargo.toml --out dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: kitt-native-${{ runner.os }}-${{ runner.arch }}
          path: dist-native/*
