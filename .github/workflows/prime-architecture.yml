name: Prime Architecture Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prime-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Assistant runtime companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: 9eba8203c209a253f222c1fa10ce8ca874f39ef7
          path: assistant-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install split Python project
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
      - name: Prime architecture suite
        run: python -m unittest discover -s tests/prime_architecture -v
      - name: 1k repository benchmark smoke
        run: python benchmarks/scale_benchmark.py --files 1000
      - name: Safe runtime schema benchmark
        run: python benchmarks/safe_runtime_benchmark.py
