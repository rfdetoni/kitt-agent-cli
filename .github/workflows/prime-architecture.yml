name: Prime Architecture Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-prime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python project
        run: python -m pip install -e .
      - name: Run Python suite
        run: python -m unittest discover -s tests -v
      - name: Prime architecture suite
        run: python -m unittest discover -s tests/prime_architecture -v
      - name: 1k repository benchmark smoke
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python benchmarks/scale_benchmark.py --files 1000
      - name: Safe runtime schema benchmark
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python benchmarks/safe_runtime_benchmark.py
