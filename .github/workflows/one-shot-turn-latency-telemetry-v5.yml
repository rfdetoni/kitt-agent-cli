name: One-shot turn latency telemetry v5
on:
  push:
    branches: [perf/turn-latency-telemetry]
permissions:
  contents: write
jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/turn-latency-telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply telemetry patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {n}")
              return s.replace(old, new, 1)

          p = Path("kitt/core/turn_processor.py")
          s = p.read_text(encoding="utf-8")

          old = "    def _emit(self, event_name: str, payload: Dict[str, Any]):\n        if self.event_callback and not self._closed:\n            self.event_callback(event_name, payload)\n\n    @staticmethod\n    def _paths_from_tool"
          new = "    def _emit(self, event_name: str, payload: Dict[str, Any]):\n        if self.event_callback and not self._closed:\n            self.event_callback(event_name, payload)\n\n    def _record_latency(\n        self,\n        turn_id: str,\n        phase: str,\n        duration_ms: float,\n        *,\n        elapsed_ms: float = 0.0,\n        detail: Optional[Dict[str, Any]] = None,\n    ) -> Dict[str, Any]:\n        payload = {\n            \"turn_id\": turn_id,\n            \"phase\": phase,\n            \"duration_ms\": round(max(0.0, float(duration_ms)), 2),\n            \"elapsed_ms\": round(max(0.0, float(elapsed_ms)), 2),\n            \"detail\": dict(detail or {}),\n        }\n        logger.info(\n            \"latency turn=%s phase=%s duration_ms=%.2f elapsed_ms=%.2f detail=%s\",\n            turn_id, phase, payload[\"duration_ms\"], payload[\"elapsed_ms\"], payload[\"detail\"],\n        )\n        self._emit(\"LatencyRecorded\", payload)\n        return payload\n\n    @staticmethod\n    def _paths_from_tool"
          s = rep(s, old, new, "latency helper")

          old = "        for chunk in _invoke_chat_stream(messages, system_prompt):\n            if turn_id and self._cancel_requested(turn_id):\n"
          new = "        model_request_started_at = time.perf_counter()\n        first_model_chunk = True\n        for chunk in _invoke_chat_stream(messages, system_prompt):\n            if first_model_chunk:\n                first_model_chunk = False\n                self._record_latency(\n                    turn_id,\n                    \"model_ttft\",\n                    (time.perf_counter() - model_request_started_at) * 1000,\n                    detail={\"session\": \"named\" if session_key else \"default\"},\n                )\n            if turn_id and self._cancel_requested(turn_id):\n"
          s = rep(s, old, new, "model ttft")

          old = "            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            for streamed_response, event in self._stream_execution_response(\n"
          new = "            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            model_round_started_at = time.perf_counter()\n            for streamed_response, event in self._stream_execution_response(\n"
          s = rep(s, old, new, "model round")

          old = "            call_id = uuid.uuid4().hex[:8]\n            if not self.turn_guard.begin(cmd.turn_id):\n"
          new = "            self._record_latency(\n                cmd.turn_id,\n                \"tool_proposal\",\n                (time.perf_counter() - model_round_started_at) * 1000,\n                detail={\"tool\": tool_name, \"call\": tool_calls},\n            )\n            call_id = uuid.uuid4().hex[:8]\n            if not self.turn_guard.begin(cmd.turn_id):\n"
          s = rep(s, old, new, "tool proposal")

          old = "            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            try:\n                tool_result = self.registry.execute_tool(\n"
          new = "            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            tool_started_at = time.perf_counter()\n            try:\n                tool_result = self.registry.execute_tool(\n"
          s = rep(s, old, new, "tool start")

          old = "            finally:\n                self.turn_guard.end(cmd.turn_id)\n            logger.debug(\n                \"host result turn=%s call=%s tool=%s success=%s approval=%s error=%r\",\n"
          new = "            finally:\n                self.turn_guard.end(cmd.turn_id)\n            self._record_latency(\n                cmd.turn_id,\n                \"tool_preflight\" if tool_result.requires_approval else \"tool_execution\",\n                (time.perf_counter() - tool_started_at) * 1000,\n                detail={\"tool\": tool_name, \"requires_approval\": bool(tool_result.requires_approval)},\n            )\n            logger.debug(\n                \"host result turn=%s call=%s tool=%s success=%s approval=%s error=%r\",\n"
          s = rep(s, old, new, "tool timing")

          old = "            # 1. Semantic Filter\n            task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)\n"
          new = "            # 1. Semantic Filter\n            semantic_started_at = time.perf_counter()\n            task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)\n            self._record_latency(\n                cmd.turn_id,\n                \"semantic\",\n                (time.perf_counter() - semantic_started_at) * 1000,\n                elapsed_ms=(time.time() - turn_started_at) * 1000,\n                detail={\"source\": str(getattr(filter_res, \"source\", \"\"))},\n            )\n"
          s = rep(s, old, new, "semantic timing")

          old = "            context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(\n                cmd, task, plan, exe_profile, sf_client\n            )\n"
          new = "            context_started_at = time.perf_counter()\n            context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(\n                cmd, task, plan, exe_profile, sf_client\n            )\n            self._record_latency(\n                cmd.turn_id,\n                \"context_retrieval\",\n                (time.perf_counter() - context_started_at) * 1000,\n                elapsed_ms=(time.time() - turn_started_at) * 1000,\n                detail={\"selected\": len(context_blocks), \"explicit\": len(explicit_items)},\n            )\n"
          s = rep(s, old, new, "context timing")

          old = "        from kitt.security.mutation_preconditions import validate_preconditions\n        valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())\n"
          new = "        self._record_latency(\n            turn_id,\n            \"approval_wait\",\n            (time.time() - pa.created_at) * 1000,\n            detail={\"tool\": pa.tool_name},\n        )\n\n        from kitt.security.mutation_preconditions import validate_preconditions\n        valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())\n"
          s = rep(s, old, new, "approval wait")

          old = "        consume_failed = False\n        edit_result = None\n        try:\n"
          new = "        consume_failed = False\n        edit_result = None\n        approved_tool_started_at = time.perf_counter()\n        try:\n"
          s = rep(s, old, new, "approved start")

          old = "        finally:\n            self.turn_guard.end(turn_id)\n\n        if consume_failed:\n"
          new = "        finally:\n            self.turn_guard.end(turn_id)\n\n        self._record_latency(\n            turn_id,\n            \"tool_execution\",\n            (time.perf_counter() - approved_tool_started_at) * 1000,\n            detail={\"tool\": pa.tool_name, \"approved\": True},\n        )\n\n        if consume_failed:\n"
          s = rep(s, old, new, "approved timing")
          p.write_text(s, encoding="utf-8")

          Path("tests/test_turn_latency_telemetry.py").write_text("import time\nimport unittest\nfrom types import SimpleNamespace\nfrom kitt.core.turn_processor import TurnProcessor\n\nclass Harness:\n    reasoning_effort = 50\n    _clean_visible_text = staticmethod(TurnProcessor._clean_visible_text)\n    _record_latency = TurnProcessor._record_latency\n    def __init__(self): self.events = []\n    def _cancel_requested(self, turn_id): return False\n    def _emit(self, name, payload): self.events.append((name, payload))\n\nclass Client:\n    profile = SimpleNamespace(model=\"chatgpt-web\")\n    def chat_stream(self, messages, **kwargs): yield \"hello\"\n\nclass TestLatencyTelemetry(unittest.TestCase):\n    def test_callback_shape(self):\n        h = Harness(); p = h._record_latency(\"t1\", \"semantic\", 12.345, elapsed_ms=20, detail={\"source\": \"local\"})\n        self.assertEqual(p[\"duration_ms\"], 12.35)\n        self.assertEqual(h.events[0][0], \"LatencyRecorded\")\n    def test_ttft_is_side_channel(self):\n        h = Harness(); result = list(TurnProcessor._stream_execution_response(h, Client(), [{\"role\":\"user\",\"content\":\"x\"}], \"sys\", turn_id=\"t2\", started_at=time.time(), session_key=\"c1\"))\n        self.assertTrue(any(n == \"LatencyRecorded\" and p[\"phase\"] == \"model_ttft\" for n,p in h.events))\n        self.assertTrue(any(text == \"hello\" for text,_ in result))\n\nif __name__ == \"__main__\": unittest.main()\n", encoding="utf-8")
          PY
          git diff --check
      - name: Validate telemetry
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m compileall -q kitt tests
          python -m pytest -q tests/test_turn_latency_telemetry.py tests/test_reverse_proxy_fast_path.py tests/test_arun_turn_approval_lifecycle.py tests/test_cancellation_real_stop.py tests/test_cancellation_unblocks_prompt.py tests/test_e2e_pipeline.py tests/test_prime_runtime.py tests/test_safe_python.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-turn-latency-telemetry*.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument turn latency phases'
          git push origin HEAD:perf/turn-latency-telemetry
