name: Automatic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          next="$(python .github/scripts/next_semver.py "$current")"
          if [[ -z "$next" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the latest semantic tag."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Update package version in release commit
        if: steps.version.outputs.release == 'true' && steps.version.outputs.next != steps.version.outputs.current
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["NEXT_VERSION"]

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          updated, count = re.subn(
              r'(?m)^version = "[0-9]+\.[0-9]+\.[0-9]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update [project] version in pyproject.toml")
          pyproject.write_text(updated)

          lock = Path("uv.lock")
          lock_text = lock.read_text()
          package_pattern = re.compile(
              r'(\[\[package\]\]\nname = "kitt-agent-cli"\nversion = ")([0-9]+\.[0-9]+\.[0-9]+)(")'
          )
          lock_updated, count = package_pattern.subn(
              lambda match: f'{match.group(1)}{version}{match.group(3)}',
              lock_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update kitt-agent-cli version in uv.lock")
          lock.write_text(lock_updated)
          PY
      - name: Create immutable release tag
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit --allow-empty -m "chore(release): ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Dispatch validated release pipeline
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"
