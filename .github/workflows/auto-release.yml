name: Automatic Release

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated Agent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate immutable release candidate
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin main

          head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$head" != "$main_head" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Validated workflow SHA $head is no longer current main $main_head; skipping release."
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

          current="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          lock_version="$(python - <<'PY'
          import re
          text = open("uv.lock", encoding="utf-8").read()
          match = re.search(r'\[\[package\]\]\nname = "kitt-agent-cli"\nversion = "([^"]+)"', text)
          if not match:
              raise SystemExit("kitt-agent-cli package entry missing from uv.lock")
          print(match.group(1))
          PY
          )"
          runtime_version="$(python - <<'PY'
          import re
          text = open("kitt/__init__.py", encoding="utf-8").read()
          match = re.search(r'(?m)^\s*__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$', text)
          if not match:
              raise SystemExit("runtime fallback version missing from kitt/__init__.py")
          print(match.group(1))
          PY
          )"

          if [[ "$current" != "$lock_version" || "$current" != "$runtime_version" ]]; then
            echo "Version metadata mismatch: pyproject=$current uv.lock=$lock_version runtime=$runtime_version" >&2
            exit 1
          fi
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must be strict semantic version: $current" >&2
            exit 1
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest published release is not strict semver: $latest_tag" >&2
            exit 1
          fi
          latest="${latest_tag#v}"
          relation="$(python - "$current" "$latest" <<'PY'
          import re, sys
          pattern = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def parse(raw):
              match = pattern.fullmatch(raw)
              if not match:
                  raise SystemExit(f"invalid semantic version: {raw}")
              return tuple(map(int, match.groups()))
          current, latest = parse(sys.argv[1]), parse(sys.argv[2])
          print("behind" if current < latest else "ahead" if current > latest else "equal")
          PY
          )"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "relation=$relation" >> "$GITHUB_OUTPUT"

          if [[ "$relation" == "behind" ]]; then
            echo "Validated candidate $current is behind latest release $latest; refusing release." >&2
            exit 1
          fi

      - name: No release required
        if: steps.state.outputs.stale != 'true' && steps.state.outputs.relation == 'equal'
        run: echo "Validated main already matches v${{ steps.state.outputs.current }}; no release required."

      - name: Tag and dispatch validated release
        if: steps.state.outputs.stale != 'true' && steps.state.outputs.relation == 'ahead'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.state.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CURRENT_VERSION}"
          head="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            if [[ "$tagged" != "$head" ]]; then
              echo "Immutable tag $tag already points to $tagged, expected validated SHA $head." >&2
              exit 1
            fi
            echo "Tag $tag already points to validated SHA $head."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$head" >/dev/null
            echo "Created immutable tag $tag at validated SHA $head."
          fi

          gh workflow run release.yml --ref "$tag" -f tag="$tag"
