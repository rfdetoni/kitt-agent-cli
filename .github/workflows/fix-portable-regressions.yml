name: fix-portable-regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-portable-regressions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply portable regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'kitt/skills/loader.py',
              'self.max_total_chars = max(2000, min(int(max_total_chars), 128000))',
              'self.max_total_chars = max(256, min(int(max_total_chars), 128000))',
          )
          replace_once(
              'kitt/skills/loader.py',
              '''        scored.sort(key=lambda item: (-item[0], item[1]))\n        selected: list[tuple[int, str]] = []\n        used = 0\n        for _, index, text in scored:\n            if used >= budget:\n                break\n            remaining = budget - used\n            if remaining < 128:\n                break\n            piece = text[:remaining]\n            selected.append((index, piece))\n            used += len(piece) + 2\n        selected.sort(key=lambda item: item[0])\n\n        header = (\n            f"---\\nname: {getattr(skill, 'name', 'unknown')}\\n"\n            f"description: {getattr(skill, 'description', '')}\\n"\n            "lazy_excerpt: true\\n---\\n"\n        )\n        body = "\\n\\n".join(text for _, text in selected)\n        return (header + body)[:budget]\n''',
              '''        scored.sort(key=lambda item: (-item[0], item[1]))\n        header = (\n            f"---\\nname: {getattr(skill, 'name', 'unknown')}\\n"\n            f"description: {getattr(skill, 'description', '')}\\n"\n            "lazy_excerpt: true\\n---\\n"\n        )\n        body_budget = max(0, budget - len(header))\n        selected: list[tuple[int, str]] = []\n        used = 0\n        for _, index, text in scored:\n            if used >= body_budget:\n                break\n            separator_cost = 2 if selected else 0\n            remaining = body_budget - used - separator_cost\n            if remaining < 128:\n                break\n            piece = text[:remaining]\n            selected.append((index, piece))\n            used += len(piece) + separator_cost\n        selected.sort(key=lambda item: item[0])\n\n        body = "\\n\\n".join(text for _, text in selected)\n        return header + body\n''',
          )
          replace_once(
              'kitt/native/fallback.py',
              '''def symbols_in_file(root: Path, rel: str) -> list[dict[str, Any]]:\n    path = (root / rel).resolve()\n    if root not in path.parents and path != root:\n        raise PermissionError("path escapes repository root")\n    text = path.read_text(encoding="utf-8", errors="replace")\n''',
              '''def symbols_in_file(root: Path, rel: str) -> list[dict[str, Any]]:\n    path = (root / rel).resolve()\n    if root not in path.parents and path != root:\n        raise PermissionError("path escapes repository root")\n    # Preserve physical newlines so AST-derived UTF-8 byte offsets stay aligned\n    # with the raw bytes later sliced by read_symbol/replace_symbol on Windows.\n    text = path.read_bytes().decode("utf-8", errors="replace")\n''',
          )

          finalizer = Path('.github/workflows/finalize-portable-boundary.yml')
          text = finalizer.read_text(encoding='utf-8')
          marker = '# rerun-after-portable-regression-fixes-v3\n'
          if marker not in text:
              finalizer.write_text(text + '\n' + marker, encoding='utf-8')
          Path('.github/workflows/fix-portable-regressions.yml').unlink()
          PY
      - name: Focused regression gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
          python -m pytest -q tests/test_lazy_skill_loader.py tests/native/test_fallback_engine.py
          python - <<'PY'
          import ast
          import tempfile
          from pathlib import Path
          from kitt.native.bridge import NativeCodeEngine

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              path = root / 'sample.py'
              path.write_bytes(b'def first():\r\n    return 1\r\n\r\ndef second():\r\n    return 2\r\n')
              engine = NativeCodeEngine(str(root))
              second = next(s for s in engine.find_symbols('second') if s['name'] == 'second')
              current = engine.read_symbol(second['id'])
              result = engine.replace_symbol(
                  second['id'],
                  'def second():\n    return 3\n',
                  expected_hash=current['symbol']['source_hash'],
              )
              assert result['changed'], result
              ast.parse(path.read_text(encoding='utf-8'))
              assert 'return 3' in path.read_text(encoding='utf-8')
          print('CRLF symbol replacement: ok')
          PY
      - name: Commit fixes and retrigger finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(portable): enforce skill budget and CRLF-safe symbol offsets'
          git push origin HEAD:main
