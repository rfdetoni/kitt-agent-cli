name: One-shot turn latency telemetry v2

on:
  push:
    branches: [perf/turn-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/turn-latency-telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument turn pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          events = Path('kitt/core/turn_events.py')
          text = events.read_text()
          marker = '@dataclass\nclass TurnCompleted(TurnEvent):'
          latency = '''@dataclass
          class LatencyRecorded(TurnEvent):
              phase: str = ""
              duration_ms: float = 0.0
              elapsed_ms: float = 0.0
              detail: Dict[str, Any] = field(default_factory=dict)

          '''
          if 'class LatencyRecorded(' not in text:
              text = once(text, marker, latency + marker, 'turn event insertion')
          events.write_text(text)

          path = Path('kitt/core/turn_processor.py')
          text = path.read_text()
          text = once(
              text,
              'EditApplied, MetricsRecorded, TurnCompleted, TurnFailed,',
              'EditApplied, MetricsRecorded, LatencyRecorded, TurnCompleted, TurnFailed,',
              'latency event import',
          )

          helper_marker = '    @staticmethod\n    def _paths_from_tool'
          helper = '''    def _latency_event(
              self,
              turn_id: str,
              phase: str,
              duration_ms: float,
              *,
              elapsed_ms: float = 0.0,
              detail: Optional[Dict[str, Any]] = None,
          ) -> LatencyRecorded:
              duration = round(max(0.0, float(duration_ms)), 2)
              elapsed = round(max(0.0, float(elapsed_ms)), 2)
              safe_detail = dict(detail or {})
              logger.info(
                  "latency turn=%s phase=%s duration_ms=%.2f elapsed_ms=%.2f detail=%s",
                  turn_id, phase, duration, elapsed, safe_detail,
              )
              self._emit("LatencyRecorded", {
                  "turn_id": turn_id,
                  "phase": phase,
                  "duration_ms": duration,
                  "elapsed_ms": elapsed,
                  "detail": safe_detail,
              })
              return LatencyRecorded(
                  phase=phase,
                  duration_ms=duration,
                  elapsed_ms=elapsed,
                  detail=safe_detail,
              )

          '''
          text = once(text, helper_marker, helper + helper_marker, 'latency helper')

          text = once(
              text,
              '        if "lfm" in getattr(profile, "model", "").lower():\n            raw_text = "".join(_invoke_chat_stream(messages, system_prompt))',
              '''        if "lfm" in getattr(profile, "model", "").lower():
              request_started_at = time.perf_counter()
              chunks = []
              first_chunk = True
              for chunk in _invoke_chat_stream(messages, system_prompt):
                  if first_chunk:
                      first_chunk = False
                      yield "", self._latency_event(
                          turn_id, "model_ttft",
                          (time.perf_counter() - request_started_at) * 1000,
                          detail={"session": "named" if session_key else "default"},
                      )
                  chunks.append(chunk)
              raw_text = "".join(chunks)''',
              'lfm ttft',
          )

          text = once(
              text,
              '''        for chunk in _invoke_chat_stream(messages, system_prompt):
              if turn_id and self._cancel_requested(turn_id):
                  break
              full_response += chunk''',
              '''        request_started_at = time.perf_counter()
              first_chunk = True
              for chunk in _invoke_chat_stream(messages, system_prompt):
                  if turn_id and self._cancel_requested(turn_id):
                      break
                  if first_chunk:
                      first_chunk = False
                      yield full_response, self._latency_event(
                          turn_id, "model_ttft",
                          (time.perf_counter() - request_started_at) * 1000,
                          detail={"session": "named" if session_key else "default"},
                      )
                  full_response += chunk''',
              'stream ttft',
          )

          text = once(text, '        malformed_calls = 0\n\n        thinking_started_at = time.time()',
                      '        malformed_calls = 0\n        model_round = 0\n\n        thinking_started_at = time.time()', 'model round counter')
          text = once(text,
                      '            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            for streamed_response, event in self._stream_execution_response(',
                      '            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            model_round += 1\n            model_round_started_at = time.perf_counter()\n            for streamed_response, event in self._stream_execution_response(',
                      'model round start')
          text = once(text,
                      '                    yield event, None, None\n\n            if not thinking_completed:',
                      '''                    yield event, None, None

              yield self._latency_event(
                  cmd.turn_id, "model_roundtrip",
                  (time.perf_counter() - model_round_started_at) * 1000,
                  detail={"round": model_round},
              ), None, None

              if not thinking_completed:''',
                      'model roundtrip')

          text = once(text,
                      '''            call_id = uuid.uuid4().hex[:8]
              if not self.turn_guard.begin(cmd.turn_id):''',
                      '''            call_id = uuid.uuid4().hex[:8]
              yield self._latency_event(
                  cmd.turn_id, "tool_proposal",
                  (time.perf_counter() - model_round_started_at) * 1000,
                  detail={"round": model_round, "tool": tool_name},
              ), None, None
              if not self.turn_guard.begin(cmd.turn_id):''',
                      'tool proposal')
          text = once(text,
                      '            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            try:\n                tool_result = self.registry.execute_tool(',
                      '            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            tool_started_at = time.perf_counter()\n            try:\n                tool_result = self.registry.execute_tool(',
                      'tool execution start')
          text = once(text,
                      '            if tool_result.requires_approval:\n                # Pending-action registration is state mutation.',
                      '''            yield self._latency_event(
                  cmd.turn_id,
                  "tool_preflight" if tool_result.requires_approval else "tool_execution",
                  (time.perf_counter() - tool_started_at) * 1000,
                  detail={"tool": tool_name, "requires_approval": bool(tool_result.requires_approval)},
              ), None, None
              if tool_result.requires_approval:
                  # Pending-action registration is state mutation.''',
                      'tool execution timing')

          text = once(text,
                      '            # 1. Semantic Filter\n            task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)',
                      '''            # 1. Semantic Filter
              semantic_started_at = time.perf_counter()
              task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)
              yield self._latency_event(
                  cmd.turn_id, "semantic",
                  (time.perf_counter() - semantic_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"source": str(getattr(filter_res, "source", ""))},
              )''',
                      'semantic timing')
          text = once(text,
                      '''            context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(
                  cmd, task, plan, exe_profile, sf_client
              )''',
                      '''            context_started_at = time.perf_counter()
              context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(
                  cmd, task, plan, exe_profile, sf_client
              )
              yield self._latency_event(
                  cmd.turn_id, "context_retrieval",
                  (time.perf_counter() - context_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"selected": len(context_blocks), "explicit": len(explicit_items)},
              )''',
                      'context timing')

          text = once(text,
                      '        from kitt.security.mutation_preconditions import validate_preconditions\n        valid, prec_error = validate_preconditions',
                      '''        yield self._latency_event(
              turn_id, "approval_wait",
              (time.time() - pa.created_at) * 1000,
              detail={"tool": pa.tool_name},
          )

          from kitt.security.mutation_preconditions import validate_preconditions
          valid, prec_error = validate_preconditions''',
                      'approval wait')
          text = once(text,
                      '        consume_failed = False\n        edit_result = None\n        try:',
                      '        consume_failed = False\n        edit_result = None\n        approved_tool_started_at = time.perf_counter()\n        try:',
                      'approved execution start')
          text = once(text,
                      '        finally:\n            self.turn_guard.end(turn_id)\n\n        if consume_failed:',
                      '''        finally:
              self.turn_guard.end(turn_id)

          yield self._latency_event(
              turn_id, "tool_execution",
              (time.perf_counter() - approved_tool_started_at) * 1000,
              detail={"tool": pa.tool_name, "approved": True},
          )

          if consume_failed:''',
                      'approved execution timing')
          path.write_text(text)

          Path('tests/test_turn_latency_telemetry.py').write_text('''import time\nimport unittest\nfrom types import SimpleNamespace\n\nfrom kitt.core.turn_events import LatencyRecorded\nfrom kitt.core.turn_processor import TurnProcessor\n\n\nclass _StreamingClient:\n    profile = SimpleNamespace(model="chatgpt-web")\n    def chat_stream(self, messages, **kwargs):\n        yield "hello"\n\n\nclass _Harness:\n    reasoning_effort = 50\n    _clean_visible_text = staticmethod(TurnProcessor._clean_visible_text)\n    def _cancel_requested(self, turn_id): return False\n    def _emit(self, *args, **kwargs): pass\n    _latency_event = TurnProcessor._latency_event\n\n\nclass TestTurnLatencyTelemetry(unittest.TestCase):\n    def test_stream_emits_ttft_metric(self):\n        events = list(TurnProcessor._stream_execution_response(\n            _Harness(), _StreamingClient(), [{"role": "user", "content": "hi"}],\n            "system", turn_id="turn-1", started_at=time.time(), session_key="conv-1"\n        ))\n        timing = [event for _, event in events if isinstance(event, LatencyRecorded)]\n        self.assertTrue(any(event.phase == "model_ttft" for event in timing))\n        self.assertTrue(all(event.duration_ms >= 0 for event in timing))\n\n    def test_latency_event_keeps_details(self):\n        event = TurnProcessor._latency_event(_Harness(), "turn-2", "context_retrieval", 12.345, elapsed_ms=20, detail={"selected": 3})\n        self.assertEqual(event.duration_ms, 12.35)\n        self.assertEqual(event.detail, {"selected": 3})\n\n\nif __name__ == "__main__": unittest.main()\n''')
          PY
          git diff --check
      - name: Validate telemetry
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m compileall -q kitt tests
          python -m pytest -q tests/test_turn_latency_telemetry.py tests/test_reverse_proxy_fast_path.py tests/test_arun_turn_approval_lifecycle.py tests/test_e2e_pipeline.py tests/test_prime_runtime.py tests/test_safe_python.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-turn-latency-telemetry.yml .github/workflows/one-shot-turn-latency-telemetry-v2.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument turn latency phases'
          git push origin HEAD:perf/turn-latency-telemetry
