name: finalize-portable-boundary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-portable-boundary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Agent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Assistant companion
        uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-assistant
          ref: main
          path: assistant-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decouple optional resident capabilities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'kitt/cli/main.py',
              'import asyncio\nimport logging\n',
              'import asyncio\nimport importlib.util\nimport logging\n',
          )
          replace_once(
              'kitt/cli/main.py',
              'def _configure_debug_log() -> None:\n',
              '''def _module_available(name: str) -> bool:\n    try:\n        return importlib.util.find_spec(name) is not None\n    except (ImportError, ModuleNotFoundError, ValueError):\n        return False\n\n\ndef _missing_companion(feature: str, package: str) -> int:\n    print(\n        f"{feature} requires the separately owned {package} companion. "\n        "Use the K.I.T.T. ecosystem/Agent installer or install that companion package.",\n        file=sys.stderr,\n    )\n    return 2\n\n\ndef _configure_debug_log() -> None:\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '    daemon_authoritative = bool(base_config.daemon_enabled and persistent)\n    config = replace(\n        base_config,\n        history_enabled=persistent,\n        persistence_enabled=persistent,\n        frontend_only=daemon_authoritative,\n    )\n',
              '''    resident_available = _module_available("kitt.daemon.client")\n    daemon_enabled = bool(base_config.daemon_enabled and resident_available)\n    daemon_authoritative = bool(daemon_enabled and persistent)\n    config = replace(\n        base_config,\n        history_enabled=persistent,\n        persistence_enabled=persistent,\n        daemon_enabled=daemon_enabled,\n        frontend_only=daemon_authoritative,\n    )\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand == "daemon":\n        from kitt.cli.commands import handle_daemon_command\n\n        return handle_daemon_command(action=args.daemon_action, root_dir=args.root)\n''',
              '''    if args.subcommand == "daemon":\n        if not _module_available("kitt.daemon.process"):\n            return _missing_companion("Daemon management", "kitt-assistant-runtime")\n        from kitt.cli.commands import handle_daemon_command\n\n        return handle_daemon_command(action=args.daemon_action, root_dir=args.root)\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand in {"remote", "web"}:\n        from kitt.remote.cli import run_remote_command\n''',
              '''    if args.subcommand in {"remote", "web"}:\n        if not _module_available("kitt.remote.cli"):\n            return _missing_companion("Remote/Web control", "kitt-assistant-runtime")\n        from kitt.remote.cli import run_remote_command\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand == "sessions":\n        from kitt.cli.commands import handle_sessions_command\n''',
              '''    if args.subcommand == "sessions":\n        if not _module_available("kitt.daemon.client"):\n            from kitt.core.runtime import KittRuntime\n            from kitt.core.runtime_config import RuntimeConfig\n            rt = KittRuntime.build(args.root, config=RuntimeConfig(daemon_enabled=False))\n            try:\n                convs = rt.history.list_history(limit=20)\n                print("\\n\\033[1;36m=== KITT Sessions (Local) ===\\033[0m")\n                for conv in convs:\n                    print(f"  • \\033[1m{conv.get('id', '')[:12]}\\033[0m {conv.get('title', '')}")\n                return 0\n            finally:\n                rt.close()\n        from kitt.cli.commands import handle_sessions_command\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand == "attach":\n        from kitt.cli.commands import handle_attach_command\n''',
              '''    if args.subcommand == "attach":\n        if not _module_available("kitt.daemon.client"):\n            return _missing_companion("Daemon session attach", "kitt-assistant-runtime")\n        from kitt.cli.commands import handle_attach_command\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand == "resume":\n        from kitt.cli.commands import handle_resume_command\n''',
              '''    if args.subcommand == "resume":\n        if not _module_available("kitt.daemon.client"):\n            return _missing_companion("Daemon session resume", "kitt-assistant-runtime")\n        from kitt.cli.commands import handle_resume_command\n''',
          )
          replace_once(
              'kitt/cli/main.py',
              '''    if args.subcommand == "evolve":\n        from kitt.evolution.cli import handle_evolve_command\n''',
              '''    if args.subcommand == "evolve":\n        if not _module_available("kitt.evolution.cli"):\n            return _missing_companion("Self-evolution", "kitt-evolution")\n        from kitt.evolution.cli import handle_evolve_command\n''',
          )

          optional_daemon_import = '''    import asyncio\n    from kitt.daemon.client import DaemonClient\n    from kitt.extensions.manager import ExtensionManager\n'''
          optional_daemon_replacement = '''    import asyncio\n    from kitt.extensions.manager import ExtensionManager\n\n    try:\n        from kitt.daemon.client import DaemonClient\n    except ModuleNotFoundError as exc:\n        if exc.name and not exc.name.startswith("kitt.daemon"):\n            raise\n        DaemonClient = None\n'''
          replace_once(
              'kitt/cli/commands.py',
              optional_daemon_import,
              optional_daemon_replacement,
              expected=2,
          )
          daemon_request = '''    async def _daemon_request(ipc_action: str, params=None):\n        client = DaemonClient(workspace_root=root_dir)\n'''
          daemon_request_safe = '''    async def _daemon_request(ipc_action: str, params=None):\n        if DaemonClient is None:\n            return None\n        client = DaemonClient(workspace_root=root_dir)\n'''
          replace_once(
              'kitt/cli/commands.py',
              daemon_request,
              daemon_request_safe,
              expected=2,
          )

          replace_once(
              'kitt/ui/daemon_bridge.py',
              '''from kitt.daemon.client import DaemonClient\nfrom kitt.daemon.protocol import DaemonEvent\nfrom kitt.core import turn_events as te\n''',
              '''from kitt.core import turn_events as te\n''',
          )
          replace_once(
              'kitt/ui/daemon_bridge.py',
              'def map_daemon_event_to_turn_event(event: DaemonEvent) -> Any:\n',
              'def map_daemon_event_to_turn_event(event: Any) -> Any:\n',
          )
          replace_once(
              'kitt/ui/daemon_bridge.py',
              '        self.client: Optional[DaemonClient] = None\n',
              '        self.client: Optional[Any] = None\n',
          )
          replace_once(
              'kitt/ui/daemon_bridge.py',
              '''    async def connect(self) -> bool:\n        self.client = DaemonClient(self.workspace_dir, token=self.token)\n        self._connected = await self.client.connect()\n        return self._connected\n''',
              '''    async def connect(self) -> bool:\n        try:\n            from kitt.daemon.client import DaemonClient\n        except ModuleNotFoundError as exc:\n            if exc.name and not exc.name.startswith("kitt.daemon"):\n                raise\n            return False\n        self.client = DaemonClient(self.workspace_dir, token=self.token)\n        self._connected = await self.client.connect()\n        return self._connected\n''',
          )
          replace_once(
              'kitt/ui/daemon_bridge.py',
              '    def _on_wire_event(self, event: DaemonEvent) -> None:\n',
              '    def _on_wire_event(self, event: Any) -> None:\n',
          )
          replace_once(
              'kitt/ui/event_bridge.py',
              '''            from kitt.daemon.process import start_daemon_detached\n            result = await asyncio.to_thread(start_daemon_detached, str(self.runtime.canonical_root))\n''',
              '''            try:\n                from kitt.daemon.process import start_daemon_detached\n            except ModuleNotFoundError as exc:\n                if exc.name and not exc.name.startswith("kitt.daemon"):\n                    raise\n                return False\n            result = await asyncio.to_thread(start_daemon_detached, str(self.runtime.canonical_root))\n''',
          )
          replace_once(
              'kitt/ui/remote_commands.py',
              '''from kitt.daemon.process import start_daemon_detached\nfrom kitt.remote.server import RemoteServer, RemoteServerConfig\n\nif TYPE_CHECKING:\n''',
              '''if TYPE_CHECKING:\n''',
          )
          replace_once(
              'kitt/ui/remote_commands.py',
              '    server: RemoteServer | None = getattr(app, "_remote_server", None)\n',
              '    server = getattr(app, "_remote_server", None)\n',
          )
          replace_once(
              'kitt/ui/remote_commands.py',
              '''    daemon_res = start_daemon_detached(workspace_root)\n''',
              '''    try:\n        from kitt.daemon.process import start_daemon_detached\n        from kitt.remote.server import RemoteServer, RemoteServerConfig\n    except ModuleNotFoundError as exc:\n        if exc.name and not (exc.name.startswith("kitt.daemon") or exc.name.startswith("kitt.remote")):\n            raise\n        app._show_result(\n            "K.I.T.T. Web Remote requer o companion kitt-assistant-runtime. "\n            "Instale pelo instalador do ecossistema/Agent."\n        )\n        return\n\n    daemon_res = start_daemon_detached(workspace_root)\n''',
          )
          PY
      - name: Standalone Agent gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m compileall -q kitt
          python -m kitt.cli.main --help >/dev/null
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('kitt.daemon') is None
          assert importlib.util.find_spec('kitt.remote') is None
          from kitt.observability.event_observer import OpenTelemetryEventObserver
          from kitt.ui.daemon_bridge import DaemonUIBridge
          import kitt.ui.remote_commands
          import kitt.extensions.manager
          import kitt.integrations.catalog
          from kitt.cli.main import _module_available
          assert not _module_available('kitt.daemon.client')
          assert not _module_available('kitt.remote.cli')
          print('standalone Agent imports: ok')
          PY
          python -m kitt.cli.main plugins list --root . >/dev/null
          python -m kitt.cli.main mcp list --root . >/dev/null
      - name: Composed Agent + Assistant gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('kitt.daemon.client') is not None
          assert importlib.util.find_spec('kitt.remote.cli') is not None
          from kitt.cli.main import _module_available
          assert _module_available('kitt.daemon.client')
          from kitt.daemon.redaction import sanitize_public_event_payload as resident
          from kitt.security.public_events import sanitize_public_event_payload as canonical
          assert resident is canonical
          print('composed runtime imports: ok')
          PY
          python -m pytest -q
      - name: Commit boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kitt/cli/main.py kitt/cli/commands.py kitt/ui/daemon_bridge.py kitt/ui/event_bridge.py kitt/ui/remote_commands.py
          git diff --cached --check
          git commit -m 'refactor(agent): make resident companions fully optional'
          git push origin HEAD:main
