name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-head:
    name: Current main head
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Ignore superseded push
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded push $GITHUB_SHA; current main is $current."
          fi

  test:
    needs: current-head
    if: needs.current-head.outputs.current == 'true'
    name: python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Agent development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compose Assistant runtime namespace
        run: >-
          python -m pip install --no-deps
          "git+https://github.com/rfdetoni/kitt-assistant.git@9414a5d43bf7c5ee79f87cd77fded0948897e93a#subdirectory=packages/kitt-assistant-runtime"
      - name: Regression suite
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q kitt
      - name: Static critical checks
        run: |
          python -m pip install ruff
          ruff check kitt --select F821,E9,B904,B905,S314
