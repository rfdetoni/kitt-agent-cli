name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-head:
    name: Current main head
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Ignore superseded push
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded push $GITHUB_SHA; current main is $current."
          fi

  test:
    needs: current-head
    if: needs.current-head.outputs.current == 'true'
    name: python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout kitt-memory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-memory
          ref: main
          path: memory-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build memory authority
        shell: bash
        run: |
          cargo build --manifest-path memory-source/Cargo.toml --release --locked -p kitt-memoryd
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "KITT_MEMORYD_BIN=$GITHUB_WORKSPACE/memory-source/target/release/kitt-memoryd$suffix" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_CONFIG_DIR=$RUNNER_TEMP/kitt-memory-config" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_DATA_DIR=$RUNNER_TEMP/kitt-memory-data" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_TOKEN_PATH=$RUNNER_TEMP/kitt-memory-config/auth.token" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Agent development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compose Assistant runtime namespace
        run: >-
          python -m pip install --no-deps
          "git+https://github.com/rfdetoni/kitt-assistant.git@main#subdirectory=packages/kitt-assistant-runtime"
      - name: Regression suite
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q kitt
      - name: Type check changed agentic boundaries
        run: |
          python -m pip install "mypy>=1.18,<2"
          python -m mypy --python-version 3.14 --ignore-missing-imports --follow-imports=skip --check-untyped-defs \
            kitt/children/lifecycle.py \
            kitt/children/worker.py \
            kitt/context_filter/semantic_filter.py \
            kitt/core/agent_runtime.py \
            kitt/core/execution_budget.py \
            kitt/core/turn_architect.py \
            kitt/core/turn_context.py \
            kitt/core/turn_model.py \
            kitt/goals/executor.py \
            kitt/llm/client.py \
            kitt/llm/retry.py \
            kitt/memory/memory_manager.py \
            kitt/memory/shared_client.py \
            kitt/metrics/cost_estimator.py \
            kitt/runtime/conversation_runtime.py
      - name: Static critical checks
        run: |
          python -m pip install ruff
          ruff check kitt --select F401,F841,F821,E9,B904,B905,S314 --exclude "**/__init__.py"
