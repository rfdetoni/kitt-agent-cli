name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: critical contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Assistant runtime companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: main
          path: assistant-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install split control plane
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
      - name: Compile runtime
        run: python -m compileall -q kitt assistant-source/packages/kitt-assistant-runtime/kitt
      - name: Run critical regression contracts
        run: >
          python -m pytest -q
          tests/test_smoke.py
          tests/test_execution_budget.py
          tests/test_run_coordinator.py
          tests/test_turn_processor_decomposition.py
          tests/test_event_ledger_replay.py
          tests/test_completion_contract.py
          tests/test_verification_contract.py
          tests/test_tool_payload_contract.py
          tests/test_tool_registry.py
          tests/test_tool_result_evidence.py
          tests/test_provider_auth_contract.py
          tests/test_provider_catalog_contract.py
          tests/test_provider_runtime_contract.py
          tests/test_kitt_reverse_proxy_compat.py
          tests/test_cancellation_real_stop.py
          tests/test_approvals_cas_atomic.py
          tests/test_autonomy_policy.py
          tests/test_security_and_policies.py
          tests/test_credentials_security.py
          tests/test_secret_observability_boundaries.py
          tests/test_safe_runtime_approval_delegation.py
          tests/test_extension_security.py
          tests/test_installer_service_shutdown.py
          tests/test_runtime_resilience.py
          tests/test_retry_budget_accounting.py
          tests/test_prompt_no_duplication.py
          tests/test_required_workspace_mutation_guard.py
          tests/test_children_events.py
          tests/test_child_lifecycle_guards.py
          tests/test_tui_behavioral.py
          tests/test_cli_banner_version.py
          tests/test_continuous_agent_runtime.py
          tests/memory/test_memory_manager_shared.py
          tests/memory/test_shared_memory_client.py
          tests/native/test_kitt_integration_contract.py
      - name: Clean-room provenance guard
        run: python packaging/verify_cleanroom.py
      - name: Static critical checks
        run: |
          python -m pip install ruff
          ruff check kitt --select F401,F841,F821,E9,B904,B905,S314 --exclude "**/__init__.py"
      - name: Enforce Agent ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(crates Cargo.toml Cargo.lock rust-toolchain.toml .cargo/config.toml packaging/build_native_release.py packaging/pyproject.maturin.toml kitt/daemon kitt/remote kitt/evolution kitt/evals)
          for path in "${forbidden[@]}"; do
            test ! -e "$path" || { echo "forbidden Agent-owned path reintroduced: $path" >&2; exit 1; }
          done

  windows-smoke:
    name: windows package smoke
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: python -m compileall -q kitt
      - run: kitt --help

  container-runtime:
    name: docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - run: docker pull alpine:3.20
      - name: Exercise real conversation runtime
        env:
          KITT_CONTAINER_RUNTIME: docker
          KITT_RUNTIME_TEST_IMAGE: alpine:3.20
        run: python -m pytest -q tests/integration/test_real_container_runtime.py
