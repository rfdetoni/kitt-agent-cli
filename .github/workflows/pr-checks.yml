name: PR Checks

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main] # Automatic release depends on PR Checks after merge
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: critical contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Assistant runtime companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: main
          path: assistant-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install split control plane and tools
        run: |
          python -m pip install -e '.[dev]' --no-deps -e assistant-source/packages/kitt-assistant-runtime 'wasmtime==51.0.0' 'uv==0.10.0' 'ruff>=0.9,<1'
      - name: Verify uv dependency lock using uv resolver
        run: uv lock --check
      - name: Compile runtime
        run: python -m compileall -q kitt assistant-source/packages/kitt-assistant-runtime/kitt
      - name: Complete project regression suite including release-critical contracts
        run: python -u scripts/run_release_critical.py --full
      - name: Measure bounded review transactions
        run: python scripts/benchmark_review.py --iterations 50 --file-bytes 1024
      - name: Compile test modules
        run: python -m compileall -q tests
      - name: Validate QEMU container launcher shell
        run: sh -n kitt/vm_assets/vm-entrypoint.sh
      - name: Clean-room provenance guard
        run: python packaging/verify_cleanroom.py
      - name: Static critical checks
        run: ruff check kitt --select F401,F841,F821,E9,B904,B905,S314 --exclude "**/__init__.py"
      - name: Enforce Agent ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(crates Cargo.toml Cargo.lock rust-toolchain.toml .cargo/config.toml packaging/build_native_release.py packaging/pyproject.maturin.toml kitt/daemon kitt/remote kitt/evolution kitt/evals)
          for path in "${forbidden[@]}"; do
            test ! -e "$path" || { echo "forbidden Agent-owned path reintroduced: $path" >&2; exit 1; }
          done

  windows-smoke:
    if: github.event_name != 'pull_request'
    name: windows package smoke
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m compileall -q kitt
      - name: Parse Windows OEM PowerShell scripts
        shell: pwsh
        run: |
          foreach ($asset in @('kitt/oracle_assets/kitt-bootstrap.ps1', 'kitt/oracle_assets/kitt-guest-rpc.ps1')) {
            $null = [ScriptBlock]::Create([IO.File]::ReadAllText((Resolve-Path $asset)))
          }
      - run: kitt --help

  container-runtime:
    name: docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: docker pull alpine:3.20
      - name: Exercise real conversation runtime
        env:
          KITT_CONTAINER_RUNTIME: docker
          KITT_RUNTIME_TEST_IMAGE: alpine:3.20
        run: python -m pytest -q tests/integration/test_real_container_runtime.py tests/integration/test_autonomous_docker_sandbox.py tests/integration/test_persistent_autopilot_broker.py

  podman-runtime:
    name: podman runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: podman --version
      - run: podman pull alpine:3.20
      - name: Exercise real conversation runtime with Podman
        env:
          KITT_CONTAINER_RUNTIME: podman
          KITT_RUNTIME_TEST_IMAGE: alpine:3.20
        run: python -m pytest -q tests/integration/test_real_container_runtime.py
