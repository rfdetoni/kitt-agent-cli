name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  current-head:
    name: Current main head
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Ignore superseded push
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded push $GITHUB_SHA; current main is $current."
          fi

  python:
    needs: current-head
    if: needs.current-head.outputs.current == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout kitt-memory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-memory
          ref: main
          path: memory-source
          persist-credentials: false
      - name: Checkout Assistant runtime companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: main
          path: assistant-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone memory authority
        shell: bash
        run: |
          cargo build --manifest-path memory-source/Cargo.toml --release --locked -p kitt-memoryd
          echo "KITT_MEMORYD_BIN=$GITHUB_WORKSPACE/memory-source/target/release/kitt-memoryd${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install split control plane
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
      - name: Compile Python sources
        run: python -m compileall -q kitt tests assistant-source/packages/kitt-assistant-runtime/kitt
      - name: Type check changed agentic boundaries
        run: |
          python -m pip install "mypy>=1.18,<2"
          python -m mypy --python-version 3.14 --ignore-missing-imports --follow-imports=skip --check-untyped-defs \
            kitt/core/execution_budget.py \
            kitt/memory/memory_manager.py \
            kitt/memory/shared_client.py \
            kitt/runtime/conversation_runtime.py
      - name: Run complete Agent suite
        run: python -m pytest -q
      - name: Clean-room provenance guard
        run: python packaging/verify_cleanroom.py


  real-runtime:
    needs: current-head
    if: needs.current-head.outputs.current == 'true'
    name: real runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Validate runtime binary
        run: "${{ matrix.runtime }}" --version
      - name: Install Agent
        run: python -m pip install -e ".[dev]"
      - name: Pull integration image
        run: "${{ matrix.runtime }}" pull alpine:3.20
      - name: Exercise real conversation runtime
        env:
          KITT_CONTAINER_RUNTIME: ${{ matrix.runtime }}
          KITT_RUNTIME_TEST_IMAGE: alpine:3.20
        run: python -m pytest -q tests/integration/test_real_container_runtime.py
