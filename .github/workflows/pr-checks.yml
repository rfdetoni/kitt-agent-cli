name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  current-head:
    name: Current main head
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Ignore superseded push
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded push $GITHUB_SHA; current main is $current."
          fi

  python:
    needs: current-head
    if: needs.current-head.outputs.current == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Assistant runtime companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: 75d802bad72dea2ceb92e252c67e932754a449c2
          path: assistant-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install split control plane
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
      - name: Compile Python sources
        run: python -m compileall -q kitt tests assistant-source/packages/kitt-assistant-runtime/kitt
      - name: Run complete Agent suite
        run: python -m pytest -q
      - name: Clean-room provenance guard
        run: python packaging/verify_cleanroom.py
