name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q kitt tests
      - name: Run complete Python suite
        run: python -m pytest -q
      - name: Clean-room provenance guard
        run: python packaging/verify_cleanroom.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native KITT wheel
        run: |
          python -m pip install -U pip maturin
          python packaging/build_native_release.py --out dist-native
      - name: Install generated wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist-native/*.whl
          kitt --help >/dev/null
          python -c "import kitt_native; print(kitt_native.ENGINE_VERSION)"
