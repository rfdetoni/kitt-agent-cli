name: Runtime Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-integration-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: real ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Validate runtime binary
        run: |
          "${{ matrix.runtime }}" --version
      - name: Install Agent
        run: python -m pip install -e ".[dev]"
      - name: Pull integration image
        run: |
          "${{ matrix.runtime }}" pull alpine:3.20
      - name: Exercise real conversation runtime
        env:
          KITT_CONTAINER_RUNTIME: ${{ matrix.runtime }}
          KITT_RUNTIME_TEST_IMAGE: alpine:3.20
        run: python -m pytest -q tests/integration/test_real_container_runtime.py
