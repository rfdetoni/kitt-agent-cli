name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test portable Agent control plane
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python packaging/verify_cleanroom.py
          python -m compileall -q kitt

  universal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist
      - name: Smoke portable wheel
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/python -c "import kitt; from kitt.native.bridge import NativeCodeEngine; assert NativeCodeEngine('.').status.backend in {'python','rust'}"
          smoke/bin/kitt --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: universal-dist
          path: dist/*

  publish:
    needs: universal
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Show distributions
        run: ls -la publish
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
