name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

env:
  ASSISTANT_RUNTIME_REF: 867519454ca97d0473bcefc515a39eb6fec657d0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict semantic version vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Checkout validated Assistant runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ env.ASSISTANT_RUNTIME_REF }}
          path: assistant-source
          persist-credentials: false
      - name: Test portable Agent control plane with companion runtime
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
          python packaging/verify_cleanroom.py
          python -m compileall -q kitt assistant-source/packages/kitt-assistant-runtime/kitt

  universal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build portable wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist
      - name: Smoke portable control-plane wheel without companion packages
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/python -c "import kitt; from kitt.native.bridge import NativeCodeEngine; assert NativeCodeEngine('.').status.backend in {'python','rust'}"
          smoke/bin/kitt --help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-dist
          path: dist/*

  container:
    needs: universal
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitt-agent-cli
          flavor: latest=auto
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=K.I.T.T. autonomous coding-agent control plane
            org.opencontainers.image.licenses=MIT
      - name: Publish Agent CLI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: universal
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: publish
          merge-multiple: true
      - name: Show distributions
        run: ls -la publish
      - name: Publish to PyPI
        id: pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/
      - name: Report PyPI publisher configuration failure
        if: steps.pypi.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::PyPI publish failed. GitHub Release/container publication remains valid; verify the PyPI Trusted Publisher configuration for environment 'pypi'."

  github-release:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: universal-dist
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG"
          else
            echo "Expected release tag $RELEASE_TAG was not found." >&2
            exit 1
          fi
