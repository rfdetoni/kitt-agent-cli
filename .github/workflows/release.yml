name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSISTANT_RUNTIME_REF: ce36ce4483c59fa2a46e74af84130a13bed08d5b

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Checkout validated Assistant runtime
        uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ env.ASSISTANT_RUNTIME_REF }}
          path: assistant-source
          persist-credentials: false
      - name: Test portable Agent control plane with companion runtime
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e assistant-source/packages/kitt-assistant-runtime
          python -m pytest -q
          python packaging/verify_cleanroom.py
          python -m compileall -q kitt assistant-source/packages/kitt-assistant-runtime/kitt

  universal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist
      - name: Smoke portable control-plane wheel without companion packages
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/python -c "import kitt; from kitt.native.bridge import NativeCodeEngine; assert NativeCodeEngine('.').status.backend in {'python','rust'}"
          smoke/bin/kitt --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: universal-dist
          path: dist/*

  container:
    needs: universal
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitt-agent-cli
          flavor: latest=auto
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=K.I.T.T. autonomous coding-agent control plane
            org.opencontainers.image.licenses=MIT
      - name: Publish Agent CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: universal
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Show distributions
        run: ls -la publish
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
