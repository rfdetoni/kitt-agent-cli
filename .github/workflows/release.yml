name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test Python and Rust
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python packaging/verify_cleanroom.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  universal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fallback wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: universal-dist
          path: dist/*

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build KITT native platform wheel
        run: |
          python -m pip install -U pip maturin
          python packaging/build_native_release.py --out dist-native
      - name: Smoke native wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist-native/*.whl
          python - <<'PY'
          from kitt.native.bridge import NativeCodeEngine
          engine = NativeCodeEngine('.')
          assert engine.status.backend == 'rust', engine.status
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist-native/*.whl

  publish:
    needs: [universal, native]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Show distributions
        run: ls -la publish
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
