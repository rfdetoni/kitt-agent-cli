name: One-shot turn latency telemetry v4

on:
  push:
    branches: [perf/turn-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/turn-latency-telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument turn pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label):
              n=s.count(old)
              if n != 1: raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)

          p=Path('kitt/core/turn_processor.py'); s=p.read_text()
          helper='''    def _record_latency(self, turn_id: str, phase: str, duration_ms: float, *, elapsed_ms: float = 0.0, detail: Optional[Dict[str, Any]] = None) -> Dict[str, Any]:
              payload = {
                  "turn_id": turn_id,
                  "phase": phase,
                  "duration_ms": round(max(0.0, float(duration_ms)), 2),
                  "elapsed_ms": round(max(0.0, float(elapsed_ms)), 2),
                  "detail": dict(detail or {}),
              }
              logger.info(
                  "latency turn=%s phase=%s duration_ms=%.2f elapsed_ms=%.2f detail=%s",
                  turn_id, phase, payload["duration_ms"], payload["elapsed_ms"], payload["detail"],
              )
              self._emit("LatencyRecorded", payload)
              return payload

          '''
          s=rep(s,'    @staticmethod\n    def _paths_from_tool',helper+'    @staticmethod\n    def _paths_from_tool','helper')

          s=rep(s,
              '        for chunk in _invoke_chat_stream(messages, system_prompt):\n            if turn_id and self._cancel_requested(turn_id):',
              '''        model_request_started_at = time.perf_counter()
              first_model_chunk = True
              for chunk in _invoke_chat_stream(messages, system_prompt):
                  if first_model_chunk:
                      first_model_chunk = False
                      self._record_latency(
                          turn_id, "model_ttft",
                          (time.perf_counter() - model_request_started_at) * 1000,
                          detail={"session": "named" if session_key else "default"},
                      )
                  if turn_id and self._cancel_requested(turn_id):''','ttft')

          s=rep(s,
              '            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            for streamed_response, event in self._stream_execution_response(',
              '            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)\n            model_round_started_at = time.perf_counter()\n            for streamed_response, event in self._stream_execution_response(','model round')
          s=rep(s,
              '            call_id = uuid.uuid4().hex[:8]\n            if not self.turn_guard.begin(cmd.turn_id):',
              '''            self._record_latency(
                  cmd.turn_id, "tool_proposal",
                  (time.perf_counter() - model_round_started_at) * 1000,
                  detail={"tool": tool_name, "call": tool_calls},
              )
              call_id = uuid.uuid4().hex[:8]
              if not self.turn_guard.begin(cmd.turn_id):''','tool proposal')
          s=rep(s,
              '            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            try:\n                tool_result = self.registry.execute_tool(',
              '            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None\n            tool_started_at = time.perf_counter()\n            try:\n                tool_result = self.registry.execute_tool(','tool start')
          s=rep(s,
              '            finally:\n                self.turn_guard.end(cmd.turn_id)\n            logger.debug(\n                "host result turn=%s call=%s tool=%s success=%s approval=%s error=%r",',
              '''            finally:
                  self.turn_guard.end(cmd.turn_id)
              self._record_latency(
                  cmd.turn_id,
                  "tool_preflight" if tool_result.requires_approval else "tool_execution",
                  (time.perf_counter() - tool_started_at) * 1000,
                  detail={"tool": tool_name, "requires_approval": bool(tool_result.requires_approval)},
              )
              logger.debug(
                  "host result turn=%s call=%s tool=%s success=%s approval=%s error=%r",''','tool timing')

          s=rep(s,
              '            # 1. Semantic Filter\n            task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)',
              '''            # 1. Semantic Filter
              semantic_started_at = time.perf_counter()
              task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)
              self._record_latency(
                  cmd.turn_id, "semantic", (time.perf_counter() - semantic_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"source": str(getattr(filter_res, "source", ""))},
              )''','semantic')
          s=rep(s,
              '            context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(\n                cmd, task, plan, exe_profile, sf_client\n            )',
              '''            context_started_at = time.perf_counter()
              context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(
                  cmd, task, plan, exe_profile, sf_client
              )
              self._record_latency(
                  cmd.turn_id, "context_retrieval", (time.perf_counter() - context_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"selected": len(context_blocks), "explicit": len(explicit_items)},
              )''','context')
          s=rep(s,
              '        from kitt.security.mutation_preconditions import validate_preconditions\n        valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())',
              '''        self._record_latency(
              turn_id, "approval_wait", (time.time() - pa.created_at) * 1000,
              detail={"tool": pa.tool_name},
          )
          from kitt.security.mutation_preconditions import validate_preconditions
          valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())''','approval')
          s=rep(s,'        consume_failed = False\n        edit_result = None\n        try:',
              '        consume_failed = False\n        edit_result = None\n        approved_tool_started_at = time.perf_counter()\n        try:','approved start')
          s=rep(s,'        finally:\n            self.turn_guard.end(turn_id)\n\n        if consume_failed:',
              '''        finally:
              self.turn_guard.end(turn_id)

          self._record_latency(
              turn_id, "tool_execution", (time.perf_counter() - approved_tool_started_at) * 1000,
              detail={"tool": pa.tool_name, "approved": True},
          )

          if consume_failed:''','approved timing')
          p.write_text(s)

          Path('tests/test_turn_latency_telemetry.py').write_text('''import time\nimport unittest\nfrom types import SimpleNamespace\nfrom kitt.core.turn_processor import TurnProcessor\n\nclass Harness:\n    reasoning_effort=50\n    _clean_visible_text=staticmethod(TurnProcessor._clean_visible_text)\n    _record_latency=TurnProcessor._record_latency\n    def __init__(self): self.events=[]\n    def _cancel_requested(self, turn_id): return False\n    def _emit(self,name,payload): self.events.append((name,payload))\n\nclass Client:\n    profile=SimpleNamespace(model="chatgpt-web")\n    def chat_stream(self,messages,**kwargs): yield "hello"\n\nclass TestLatency(unittest.TestCase):\n    def test_callback_shape(self):\n        h=Harness(); p=h._record_latency("t","semantic",12.345,elapsed_ms=20,detail={"source":"local"})\n        self.assertEqual(p["duration_ms"],12.35); self.assertEqual(h.events[0][0],"LatencyRecorded")\n    def test_ttft_is_side_channel(self):\n        h=Harness(); result=list(TurnProcessor._stream_execution_response(h,Client(),[{"role":"user","content":"x"}],"sys",turn_id="t",started_at=time.time(),session_key="c"))\n        self.assertTrue(any(n=="LatencyRecorded" and p["phase"]=="model_ttft" for n,p in h.events))\n        self.assertTrue(any(text=="hello" for text,_ in result))\n\nif __name__=="__main__": unittest.main()\n''')
          PY
          git diff --check
      - name: Validate telemetry
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m compileall -q kitt tests
          python -m pytest -q tests/test_turn_latency_telemetry.py tests/test_reverse_proxy_fast_path.py tests/test_arun_turn_approval_lifecycle.py tests/test_cancellation_real_stop.py tests/test_cancellation_unblocks_prompt.py tests/test_e2e_pipeline.py tests/test_prime_runtime.py tests/test_safe_python.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-turn-latency-telemetry*.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument turn latency phases'
          git push origin HEAD:perf/turn-latency-telemetry
