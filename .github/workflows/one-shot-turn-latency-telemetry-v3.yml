name: One-shot turn latency telemetry v3

on:
  push:
    branches: [perf/turn-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/turn-latency-telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument turn pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('kitt/core/turn_processor.py')
          s = p.read_text()

          marker = '''    @staticmethod
              def _paths_from_tool'''
          helper = '''    def _record_latency(
              self,
              turn_id: str,
              phase: str,
              duration_ms: float,
              *,
              elapsed_ms: float = 0.0,
              detail: Optional[Dict[str, Any]] = None,
          ) -> Dict[str, Any]:
              payload = {
                  "turn_id": turn_id,
                  "phase": phase,
                  "duration_ms": round(max(0.0, float(duration_ms)), 2),
                  "elapsed_ms": round(max(0.0, float(elapsed_ms)), 2),
                  "detail": dict(detail or {}),
              }
              logger.info(
                  "latency turn=%s phase=%s duration_ms=%.2f elapsed_ms=%.2f detail=%s",
                  turn_id,
                  phase,
                  payload["duration_ms"],
                  payload["elapsed_ms"],
                  payload["detail"],
              )
              self._emit("LatencyRecorded", payload)
              return payload

          '''
          s = once(s, marker, helper + marker, 'latency helper')

          marker = '''            return client.chat_stream(msgs, **kwargs)

              if "lfm"'''
          repl = '''            return client.chat_stream(msgs, **kwargs)

              def _timed_chat_stream(msgs, sys_prompt):
                  started = time.perf_counter()
                  first = True
                  for chunk in _invoke_chat_stream(msgs, sys_prompt):
                      if first:
                          first = False
                          self._record_latency(
                              turn_id,
                              "model_ttft",
                              (time.perf_counter() - started) * 1000,
                              detail={"session": "named" if session_key else "default"},
                          )
                      yield chunk

              if "lfm"'''
          s = once(s, marker, repl, 'timed stream helper')
          s = once(s, 'raw_text = "".join(_invoke_chat_stream(messages, system_prompt))',
                   'raw_text = "".join(_timed_chat_stream(messages, system_prompt))', 'lfm stream')
          s = once(s, 'for chunk in _invoke_chat_stream(messages, system_prompt):',
                   'for chunk in _timed_chat_stream(messages, system_prompt):', 'normal stream')

          s = once(s,
              '''            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)
              for streamed_response, event in self._stream_execution_response(''',
              '''            self._rebudget_execution_messages(execution_messages, request.system_prompt, exe_profile)
              model_round_started_at = time.perf_counter()
              for streamed_response, event in self._stream_execution_response(''',
              'model round start')

          s = once(s,
              '''            call_id = uuid.uuid4().hex[:8]
              if not self.turn_guard.begin(cmd.turn_id):''',
              '''            self._record_latency(
                  cmd.turn_id,
                  "tool_proposal",
                  (time.perf_counter() - model_round_started_at) * 1000,
                  detail={"tool": tool_name, "call": tool_calls},
              )
              call_id = uuid.uuid4().hex[:8]
              if not self.turn_guard.begin(cmd.turn_id):''',
              'tool proposal')

          s = once(s,
              '''            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None
              try:
                  tool_result = self.registry.execute_tool(''',
              '''            yield ToolStarted(tool_name=tool_name, args=tool_args, call_id=call_id), None, None
              tool_started_at = time.perf_counter()
              try:
                  tool_result = self.registry.execute_tool(''',
              'tool start')
          s = once(s,
              '''            finally:
                  self.turn_guard.end(cmd.turn_id)
              logger.debug(
                  "host result turn=%s call=%s tool=%s success=%s approval=%s error=%r",''',
              '''            finally:
                  self.turn_guard.end(cmd.turn_id)
              self._record_latency(
                  cmd.turn_id,
                  "tool_preflight" if tool_result.requires_approval else "tool_execution",
                  (time.perf_counter() - tool_started_at) * 1000,
                  detail={"tool": tool_name, "requires_approval": bool(tool_result.requires_approval)},
              )
              logger.debug(
                  "host result turn=%s call=%s tool=%s success=%s approval=%s error=%r",''',
              'tool timing')

          s = once(s,
              '''            # 1. Semantic Filter
              task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)''',
              '''            # 1. Semantic Filter
              semantic_started_at = time.perf_counter()
              task, plan, filter_res, sf_client, ctx_profile, agent_addressed = self._run_semantic_filter(cmd)
              self._record_latency(
                  cmd.turn_id,
                  "semantic",
                  (time.perf_counter() - semantic_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"source": str(getattr(filter_res, "source", ""))},
              )''',
              'semantic timing')

          s = once(s,
              '''            context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(
                  cmd, task, plan, exe_profile, sf_client
              )''',
              '''            context_started_at = time.perf_counter()
              context_map_str, explicit_str, agents_str, skills_str, context_blocks, explicit_items, build_stats, needs_project_context = self._build_context(
                  cmd, task, plan, exe_profile, sf_client
              )
              self._record_latency(
                  cmd.turn_id,
                  "context_retrieval",
                  (time.perf_counter() - context_started_at) * 1000,
                  elapsed_ms=(time.time() - turn_started_at) * 1000,
                  detail={"selected": len(context_blocks), "explicit": len(explicit_items)},
              )''',
              'context timing')

          s = once(s,
              '''        from kitt.security.mutation_preconditions import validate_preconditions
              valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())''',
              '''        self._record_latency(
              turn_id,
              "approval_wait",
              (time.time() - pa.created_at) * 1000,
              detail={"tool": pa.tool_name},
          )

          from kitt.security.mutation_preconditions import validate_preconditions
          valid, prec_error = validate_preconditions(self.root_path, pa.get_preconditions())''',
              'approval wait')

          s = once(s,
              '''        consume_failed = False
              edit_result = None
              try:''',
              '''        consume_failed = False
              edit_result = None
              approved_tool_started_at = time.perf_counter()
              try:''',
              'approved tool start')
          s = once(s,
              '''        finally:
                  self.turn_guard.end(turn_id)

              if consume_failed:''',
              '''        finally:
                  self.turn_guard.end(turn_id)

          self._record_latency(
              turn_id,
              "tool_execution",
              (time.perf_counter() - approved_tool_started_at) * 1000,
              detail={"tool": pa.tool_name, "approved": True},
          )

          if consume_failed:''',
              'approved tool timing')

          p.write_text(s)
          Path('tests/test_turn_latency_telemetry.py').write_text('''import time\nimport unittest\nfrom types import SimpleNamespace\n\nfrom kitt.core.turn_processor import TurnProcessor\n\n\nclass Harness:\n    reasoning_effort = 50\n    _clean_visible_text = staticmethod(TurnProcessor._clean_visible_text)\n    _record_latency = TurnProcessor._record_latency\n    def __init__(self): self.events = []\n    def _cancel_requested(self, turn_id): return False\n    def _emit(self, name, payload): self.events.append((name, payload))\n\nclass StreamingClient:\n    profile = SimpleNamespace(model="chatgpt-web")\n    def chat_stream(self, messages, **kwargs): yield "hello"\n\nclass TestTurnLatencyTelemetry(unittest.TestCase):\n    def test_record_latency_emits_structured_callback(self):\n        h = Harness()\n        payload = h._record_latency("t1", "semantic", 12.345, elapsed_ms=20, detail={"source": "local"})\n        self.assertEqual(payload["duration_ms"], 12.35)\n        self.assertEqual(h.events[0][0], "LatencyRecorded")\n        self.assertEqual(h.events[0][1]["detail"], {"source": "local"})\n\n    def test_stream_records_ttft_without_changing_stream_event_contract(self):\n        h = Harness()\n        result = list(TurnProcessor._stream_execution_response(h, StreamingClient(), [{"role":"user","content":"hi"}], "system", turn_id="t2", started_at=time.time(), session_key="c1"))\n        self.assertTrue(any(name == "LatencyRecorded" and data["phase"] == "model_ttft" for name, data in h.events))\n        self.assertTrue(any(text == "hello" for text, _ in result))\n\nif __name__ == "__main__": unittest.main()\n''')
          PY
          git diff --check
      - name: Validate telemetry
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          python -m compileall -q kitt tests
          python -m pytest -q tests/test_turn_latency_telemetry.py tests/test_reverse_proxy_fast_path.py tests/test_arun_turn_approval_lifecycle.py tests/test_cancellation_real_stop.py tests/test_cancellation_unblocks_prompt.py tests/test_e2e_pipeline.py tests/test_prime_runtime.py tests/test_safe_python.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-turn-latency-telemetry.yml .github/workflows/one-shot-turn-latency-telemetry-v2.yml .github/workflows/one-shot-turn-latency-telemetry-v3.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument turn latency phases'
          git push origin HEAD:perf/turn-latency-telemetry
