name: module-boundary-audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce Agent ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            crates
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .cargo/config.toml
            packaging/build_native_release.py
            packaging/pyproject.maturin.toml
            kitt/daemon
            kitt/remote
            kitt/evolution
            kitt/evals
          )
          failed=0
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "forbidden Agent-owned path reintroduced: $path" >&2
              failed=1
            fi
          done
          if grep -RInE '(^|[[:space:]/])crates/kitt-native|maturin[^\n]*kitt-agent-cli' .github install.sh install.ps1 pyproject.toml --exclude='module-boundary-audit.yml' 2>/dev/null; then
            echo 'forbidden local native-build reference found in Agent distribution files' >&2
            failed=1
          fi
          test "$failed" -eq 0
          echo 'Agent module ownership boundary: OK'
