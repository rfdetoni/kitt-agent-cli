name: One-shot approval race fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-approval-race.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch async turn lifecycle and add regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("kitt/core/turn_processor.py")
          text = path.read_text(encoding="utf-8")
          old = '''        producer.start()\n        try:\n            while True:\n                item = await queue.get()\n                if item is sentinel:\n                    break\n                yield item\n        finally:\n            if producer.is_alive():\n                self._mark_cancelled(cmd.turn_id)\n            stop.set()\n            if producer.is_alive():\n                await _asyncio.to_thread(producer.join, 2.0)\n'''
          new = '''        producer.start()\n        stream_completed = False\n        try:\n            while True:\n                item = await queue.get()\n                if item is sentinel:\n                    stream_completed = True\n                    break\n                yield item\n        finally:\n            # Thread liveness is not cancellation state. The producer can still\n            # be alive for a scheduling tick after it has published the natural\n            # completion sentinel. Only an abandoned stream should cancel the turn.\n            if not stream_completed:\n                self._mark_cancelled(cmd.turn_id)\n            stop.set()\n            if producer.is_alive():\n                await _asyncio.to_thread(producer.join, 2.0)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one arun_turn lifecycle block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_arun_turn_approval_lifecycle.py")
          test.write_text('''import asyncio\nimport threading\nimport time\nimport unittest\nfrom unittest.mock import patch\n\nfrom kitt.core.turn_command import TurnCommand\nfrom kitt.core.turn_events import TurnCompleted, TurnStarted\nfrom kitt.core.turn_processor import TurnProcessor\n\n\nclass _NaturalCompletionHarness:\n    def __init__(self):\n        self.cancelled = []\n\n    def run_turn(self, cmd):\n        yield TurnCompleted(response="done")\n\n    def _mark_cancelled(self, turn_id):\n        self.cancelled.append(turn_id)\n        return False\n\n\nclass _AbandonedStreamHarness:\n    def __init__(self):\n        self.cancelled = []\n\n    def run_turn(self, cmd):\n        yield TurnStarted(turn_id=cmd.turn_id, conversation_id=cmd.conversation_id, prompt=cmd.prompt)\n        time.sleep(0.05)\n        yield TurnCompleted(response="late")\n\n    def _mark_cancelled(self, turn_id):\n        self.cancelled.append(turn_id)\n        return False\n\n\nclass TestAsyncTurnApprovalLifecycle(unittest.TestCase):\n    def test_natural_stream_completion_does_not_infer_cancellation_from_thread_liveness(self):\n        async def run_test():\n            harness = _NaturalCompletionHarness()\n            cmd = TurnCommand(conversation_id="conv-approval", prompt="mkdir -p teste", turn_id="turn-approval")\n\n            # Force the exact old failure condition: after the sentinel is received,\n            # Thread.is_alive() still reports true for the producer scheduling tick.\n            with patch.object(threading.Thread, "is_alive", return_value=True):\n                events = [event async for event in TurnProcessor.arun_turn(harness, cmd)]\n\n            self.assertTrue(any(isinstance(event, TurnCompleted) for event in events))\n            self.assertEqual(harness.cancelled, [])\n\n        asyncio.run(run_test())\n\n    def test_abandoning_stream_before_completion_still_marks_turn_cancelled(self):\n        async def run_test():\n            harness = _AbandonedStreamHarness()\n            cmd = TurnCommand(conversation_id="conv-cancel", prompt="long task", turn_id="turn-cancel")\n            stream = TurnProcessor.arun_turn(harness, cmd)\n\n            first = await anext(stream)\n            self.assertIsInstance(first, TurnStarted)\n            await stream.aclose()\n\n            self.assertEqual(harness.cancelled, ["turn-cancel"])\n\n        asyncio.run(run_test())\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Validate focused regression
        shell: bash
        run: |
          python -m compileall -q kitt tests/test_arun_turn_approval_lifecycle.py
          python -m pip install -q -e '.[dev]'
          pytest -q tests/test_arun_turn_approval_lifecycle.py tests/test_cancellation_real_stop.py tests/test_cancellation_unblocks_prompt.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "kitt-fix-bot"
          git config user.email "kitt-fix-bot@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-approval-race.yml
          git add kitt/core/turn_processor.py tests/test_arun_turn_approval_lifecycle.py
          git diff --cached --check
          git commit -m "fix(turns): preserve approved async continuations"
          git push origin HEAD:refs/heads/fix/approval-race
