[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-agent-cli"
version = "0.3.0"
description = "K.I.T.T. autonomous AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
]

[project.optional-dependencies]
tui = [
    "prompt-toolkit>=3.0.52,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kitt = "kitt.cli.main:main"

[tool.setuptools.packages.find]
include = ["kitt*"]

[tool.setuptools.package-data]
"kitt.remote" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
