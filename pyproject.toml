[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-agent-cli"
version = "0.74.2"
description = "K.I.T.T. autonomous AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
    "defusedxml>=0.7.1,<1",
    "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@de66291bc05f9b83a6a2cfaf5b179428d4e7d79f#subdirectory=sdk/python",
]

[project.optional-dependencies]
tui = [
    "prompt-toolkit>=3.0.52,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kitt = "kitt.cli.main:main"

[tool.setuptools.packages.find]
include = ["kitt*"]

[tool.setuptools.package-data]
"*" = ["plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
