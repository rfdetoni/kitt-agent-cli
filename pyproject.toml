[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-agent-cli"
version = "0.88.34"
description = "K.I.T.T. autonomous AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
    "defusedxml>=0.7.1,<1",
    "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@ac9baf8b4b8f03e839471c7bbb7d5e52e970a9ec#subdirectory=sdk/python",
]

[project.optional-dependencies]
tui = [
    "prompt-toolkit>=3.0.52,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kitt = "kitt.cli.main:main"

[tool.setuptools.packages.find]
include = ["kitt*"]

[tool.setuptools.package-data]
"kitt" = ["vm_assets/*", "oracle_assets/*", "cleanroom_image/*"]
"*" = ["plugin.toml"]
"kitt.extensions.builtin_plugins.reverse_engineering" = ["plugin.toml", "ghidra_scripts/*.java", "frida_scripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
