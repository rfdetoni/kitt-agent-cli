# Release-time pyproject template. The source checkout keeps setuptools so the
# Python fallback install does not require Rust. Release CI uses this template
# to produce platform wheels bundling kitt_native into the same KITT wheel.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kitt-agent-cli"
version = "0.3.0"
description = "K.I.T.T. autonomous AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["prompt-toolkit>=3.0.52,<4"]

[project.scripts]
kitt = "kitt.cli.main:main"

[tool.maturin]
manifest-path = "crates/kitt-native-python/Cargo.toml"
python-source = "."
module-name = "kitt_native"
bindings = "pyo3"
strip = true
