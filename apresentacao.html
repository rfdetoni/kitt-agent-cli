<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>K.I.T.T. Agent CLI - Modern Presentation</title>
    <style>
        /* Knight Rider inspired styling */
        body {
            background-color: #000;
            color: #00f3ff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        
        /* Knight Rider scanner animation */
        .scanner {
            width: 150px;
            height: 40px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        @keyframes scan {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .scanner::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background-color: #ff0000;
            animation: scan-line 2s infinite linear;
        }
        
        @keyframes "scan-line" {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <h1>K.I.T.T. Agent CLI</h1>
    
    <!-- Add more content here as needed -->
</body>
</html>
