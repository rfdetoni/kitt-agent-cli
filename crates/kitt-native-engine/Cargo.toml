[package]
name = "kitt-native-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room native code intelligence and context optimization engine for KITT"

[dependencies]
anyhow = "1"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"

[dev-dependencies]
pretty_assertions = "1"
