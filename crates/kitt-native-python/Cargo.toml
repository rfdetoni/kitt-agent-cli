[package]
name = "kitt-native-python"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "kitt_native"
crate-type = ["cdylib"]

[dependencies]
kitt-native-engine = { path = "../kitt-native-engine" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.maturin]
name = "kitt_native"
